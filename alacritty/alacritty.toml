# $HOME/.config/alacritty/alacritty.toml
# Colors are generated by wallust — run: wallust run <wallpaper>
[general]
import = ["~/.config/alacritty/colors.toml"]

[terminal.shell]
program = "/usr/bin/fish"
args = ["--login"]

[window]
opacity = 0.80
padding.x = 10
padding.y = 10
decorations = "Full"
decorations_theme_variant = "Dark"
dimensions.columns = 120
dimensions.lines = 35

[font]
normal.family = "JetBrains Mono"
bold.family = "JetBrains Mono"
italic.family = "JetBrains Mono"
bold_italic.family = "JetBrains Mono"
size = 12.0


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
